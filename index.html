<!doctype html>
<html>

<head>
    <title>MicroProjetAR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js">
    </script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script type="module" src="https://raw.githack.com/b2renger/microprojetar/main/lib/qrTunnel.js"></script>

</head>

<body style="margin : 0px; overflow: hidden;">
    <a-scene embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best ; changeMatrixMode: modelViewMatrix;"
        vr-mode-ui="enabled: false"
        renderer="sortObjects: true; antialias: true; colorManagement: true; physicallyCorrectLights; logarithmicDepthBuffer: true;"
        smooth=" true" smoothCount="5" smoothTolerance=".05" smoothThreshold="5" sourceWidth="800" sourceHeight="600"
        displayWidth="1280" displayHeight="720">

        <a-assets>
            <audio id="audiofeur" src="./Heartbeat, Heartbreak.mp3"></audio>
        </a-assets>

        <a-marker type='barcode' value='0'>
            <a-text value="hi, this is my world !" side="double" position="0 0 -2" rotation="270 0 0" width="8" color="yellow"
                align="center">
            </a-text>
            <a-gltf-model
                src="./planet.glb"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation ="property: rotation; 
                to: 0 360 0; 
                dur: 5000; 
                easing: linear; 
                loop: true">
            </a-gltf-model>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>


<script>
    const marker = document.querySelector('a-marker');
    const audio = document.querySelector('#audiofeur');
    const planet = document.querySelector('#planet');

    marker.addEventListener('markerFound', () => {

        audio.currentTime = Math.random() * audio.duration;
        audio.play();

    });

    marker.addEventListener('markerLost', () => {

        audio.pause();
        audio.currentTime = 0;

    });

     
    planet.addEventListener('click', () => {

        planet.setAttribute('scale', '2 2 2');

    });

</script>
